<div class="container">
  <div class="img">
    <img class="think" src="Images/lamb.png" [attr.alt]="'register.lamb' | translate" />
    <img class="normal" src="Images/normal.png" [attr.alt]="'register.normal' | translate" />
  </div>

  <form
    class="form"
    [formGroup]="registerService.registerForm"
    (ngSubmit)="registerService.onSubmit(cdr)"
  >
    <fieldset>
      <legend class="title">panflow</legend>

      @if (registerService.serverError) {
        <div class="serverError">
          {{ registerService.serverError }}
        </div>
      }

      <app-auth-input controlName="userName" [label]="'register.userName' | translate"></app-auth-input>

      <app-auth-input controlName="email" [label]="'register.email' | translate" type="email"></app-auth-input>
      
      <app-password-input 
        [label]="'register.password' | translate" 
        [control]="passwordControl">
      </app-password-input>

      <app-password-input 
        [label]="'register.confirmPassword' | translate" 
        [control]="registerService.confirm"
        [passwordToMatch]="passwordControl">
      </app-password-input>

      <div class="submit">
        <button
          type="submit"
          [class.disable]="registerService.isLoading"
          [disabled]="
            registerService.isLoading ||
            registerService.registerForm.invalid ||
            registerService.confirm.invalid ||
            !registerService.matchPassword
          "
        >
          {{ registerService.isLoading ? ('general.loading' | translate) : ('register.signUp' | translate) }}
        </button>
      </div>

      <div class="login">
        <p>{{ 'register.haveAccount' | translate }} <a routerLink="/login">{{ 'register.login' | translate }}</a></p>
      </div>
    </fieldset>
  </form>
</div>
