<div class="container">
  <div class="card">
    <div class="title">
      <div class="titleText">
        <p class="eyebrow">{{ 'aspect.create' | translate }}</p>
        <h2>{{ 'aspect.title' | translate }}</h2>
      </div>
      <button
        type="button"
        (click)="aspectService.openListMode()"
        class="exit"
        aria-label="Close profile"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <form class="form" [formGroup]="aspectService.aspectForm">
      <div class="aspectName">
        <app-auth-input [label]="'aspect.name' | translate" controlName="aspectName"></app-auth-input>
      </div>

      <div class="aspectColor">
        <app-auth-input
          [label]="'aspect.color' | translate"
          controlName="aspectColor"
          type="color"
        ></app-auth-input>
      </div>

      <div class="submit">
        <button
          type="submit"
          (click)="aspectService.createAspect()"
          [class.disabled]="aspectService.aspectForm.invalid || aspectService.isLoadingCreate()"
          [disabled]="aspectService.aspectForm.invalid || aspectService.isLoadingCreate()"
        >
          {{ aspectService.isLoadingCreate() ? ('common.loading' | translate) : ('common.create' | translate) }}
        </button>
      </div>
    </form>
  </div>
</div>
