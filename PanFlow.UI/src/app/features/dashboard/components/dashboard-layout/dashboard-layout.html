@if (dashboardService.isProfileOpen) {
  <app-profile class="userProfile" (close)="dashboardService.closeProfile()"></app-profile>
}
@if(dashboardService.isTrashOpen){
  <app-trash class="trash" (close)="dashboardService.closeTrash()"></app-trash>
}
<div class="layout-container">
  <aside class="sidebar" [class.collapsed]="!dashboardService.siderOpen">
    <button class="toggle-btn" aria-label="Toggle sidebar" (click)="dashboardService.changeSiderState()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <path d="M9 3v18" />
      </svg>
    </button>
    <nav class="nav-menu">
      <ul class="nav-list">
        <li class="nav-item">
          <button class="nav-btn" routerLink="/">
            <span class="icon">🏠</span>
            <span class="label">{{ 'nav.home' | translate }}</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" routerLink="/aspects">
            <span class="icon">🌱</span>
            <span class="label">{{ 'nav.aspects' | translate }}</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" routerLink="/habits">
            <span class="icon">🎯</span>
            <span class="label">{{ 'nav.habits' | translate }}</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" routerLink="/days">
            <span class="icon">🗓️</span>
            <span class="label">{{ 'nav.days' | translate }}</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" routerLink="/analysis">
            <span class="icon">📊</span>
            <span class="label">{{ 'nav.analysis' | translate }}</span>
          </button>
        </li>
      </ul>
    </nav>
    <div class="logout-section">
      <button class="nav-btn logout-btn" (click)="dashboardService.logout()">
        <span class="icon">➜</span>
        <span class="label">{{ 'nav.logout' | translate }}</span>
      </button>
    </div>
  </aside>

  <main class="content-area">
    <router-outlet></router-outlet>

    <div class="trashIcon" aria-label="Trash" (click)="dashboardService.openTrash()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-trash2-icon lucide-trash-2"
      >
        <path d="M10 11v6" />
        <path d="M14 11v6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        <path d="M3 6h18" />
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      </svg>
    </div>

    <div class="setting" aria-label="Settings" (click)="dashboardService.openProfile()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-settings-icon lucide-settings"
      >
        <path
          d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
        />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </div>
  </main>
</div>
