<div class="input-box">
  <input 
    [type]="showPassword ? 'text' : 'password'" 
    placeholder=" " 
    [formControl]="control" />
  
  <label>{{ label }}</label>
  <span class="eye-icon" [class.active]="showPassword" (click)="togglePassword()">👁</span>
</div>

@if (control.touched) {
  <div class="Error">
    @if (control.hasError('required')) {
      <p>*{{ label }} is required</p>
    }
    @if (control.hasError('minlength')) {
      <p>*mini length is 3</p>
    }
    @if (isConfirmMismatch) {
      <p>*confirm password should match password</p>
    }
  </div>
}
