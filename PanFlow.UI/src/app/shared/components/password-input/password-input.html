<div class="input-box">
  <input 
    [type]="showPassword ? 'text' : 'password'" 
    placeholder=" " 
    [formControl]="control" />
  
  <label>{{ label }}</label>
  <span 
    class="eye-icon" 
    [class.active]="showPassword" 
    (click)="togglePassword()"
    [attr.aria-label]="(showPassword ? 'validation.hidePassword' : 'validation.showPassword') | translate"
  >👁</span>
</div>

@if (control.touched) {
  <div class="Error">
    @if (control.hasError('required')) {
      <p>*{{ label }} {{ 'validation.required' | translate }}</p>
    }
    @if (control.hasError('minlength')) {
      <p>*{{ 'validation.minLength' | translate }}</p>
    }
    @if (isConfirmMismatch) {
      <p>*{{ 'validation.passwordMismatch' | translate }}</p>
    }
  </div>
}
