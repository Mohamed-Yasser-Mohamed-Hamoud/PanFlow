<div class="container">
  <div class="card">
    <div class="title">
      <div class="titleText">
        <h2>trash</h2>
      </div>
      <button type="button" (click)="closeMe()" class="exit" aria-label="Close profile">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-circle-x-icon lucide-circle-x"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="m15 9-6 6" />
          <path d="m9 9 6 6" />
        </svg>
      </button>
    </div>
    <hr />

    <div class="segmented-control">
      <button
        class="segment"
        [class.active]="trashService.selectedTap === 'aspects'"
        [attr.aria-pressed]="trashService.selectedTap === 'aspects'"
        (click)="trashService.selectedTap = 'aspects'"
      >
        aspects
      </button>
      <button
        class="segment"
        [class.active]="trashService.selectedTap === 'habits'"
        [attr.aria-pressed]="trashService.selectedTap === 'habits'"
        (click)="trashService.selectedTap = 'habits'"
      >
        habits
      </button>
    </div>

    @if (trashService.isLoading()) {
      <div class="aspects-loader">
        <div class="spinner"></div>
        <p>Loading deleted aspects...</p>
      </div>
    } @else if (trashService.selectedTap === 'aspects') {
      <table class="trash-table">
        <thead>
          <tr>
            <th>Aspect Name</th>
            <th>Color</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          @for (aspect of trashService.deletedAspects(); track aspect.aspectId) {
            <tr>
              <td>{{ aspect.aspectName }}</td>

              <td>
                <span class="color-preview" [style.background-color]="aspect.aspectColor"> </span>
              </td>

              <td class="actions">
                <button type="button" class="action-btn restore-btn" (click)="trashService.restoreAspect(aspect.aspectId)" aria-label="Restore aspect">
                  <!-- Archive Restore Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect width="20" height="5" x="2" y="3" rx="1" />
                    <path d="M4 8v11a2 2 0 0 0 2 2h2" />
                    <path d="M20 8v11a2 2 0 0 1-2 2h-2" />
                    <path d="m9 15 3-3 3 3" />
                    <path d="M12 12v9" />
                  </svg>
                </button>

                <button type="button" class="action-btn delete-btn" (click)="trashService.deleteAspectPermanently(aspect.aspectId)" aria-label="Delete permanently">
                  <!-- Trash Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                    <path d="M3 6h18" />
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                  </svg>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    }
  </div>
</div>
